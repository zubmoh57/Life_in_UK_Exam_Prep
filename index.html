<style>
/* Layout: a single exam-desk column; a sticky status strip carries progress + clock, one question card at a time, then a marked script on submit. */
:root {
  --bg: #f3f5f9;
  --paper: #ffffff;
  --ink: #15203a;
  --muted: #5a6479;
  --line: #d9dfea;
  --accent: #1d3f8f;
  --accent-ink: #ffffff;
  --accent-soft: #e6ecfa;
  --good: #1c7a4a;
  --good-soft: #e3f3ea;
  --bad: #b3261e;
  --bad-soft: #fbe7e5;
  --warn: #9a5b00;
  --warn-soft: #fdf1dc;
  --f-display: "Newsreader", Georgia, "Times New Roman", serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --paper: #161e33; --ink: #e7ebf5; --muted: #9aa4bb; --line: #2a3550;
    --accent: #8fb0ff; --accent-ink: #0e1424; --accent-soft: #1f2b4a;
    --good: #5fd18f; --good-soft: #15301f; --bad: #ff8a80; --bad-soft: #3a1a1a;
    --warn: #f3b552; --warn-soft: #382a12; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --paper: #161e33; --ink: #e7ebf5; --muted: #9aa4bb; --line: #2a3550;
  --accent: #8fb0ff; --accent-ink: #0e1424; --accent-soft: #1f2b4a;
  --good: #5fd18f; --good-soft: #15301f; --bad: #ff8a80; --bad-soft: #3a1a1a;
  --warn: #f3b552; --warn-soft: #382a12; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: grid; gap: 24px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(1.9rem, 5vw, 2.5rem); }
h2 { font-size: 1.45rem; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: .75rem; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.lede { color: var(--muted); max-width: 62ch; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; }
.fact { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 12px; font-size: .85rem; }
.fact b { font-variant-numeric: tabular-nums; }

/* Start screen */
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.test-btn { text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 2px; transition: border-color .15s, transform .15s; }
.test-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.test-btn .n { font-family: var(--f-display); font-size: 1.25rem; font-weight: 600; }
.test-btn .last { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.test-btn .last.pass { color: var(--good); }
.test-btn .last.fail { color: var(--bad); }
.test-btn.random { grid-column: 1 / -1; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.test-btn.random .last { color: inherit; opacity: .85; }
.opts-row { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; font-size: .92rem; }
.opts-row label { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.opts-row input { width: 18px; height: 18px; accent-color: var(--accent); }

/* Exam strip */
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.strip-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.strip-title { font-weight: 600; white-space: nowrap; }
.count { white-space: nowrap; }
.strip-meta { display: flex; gap: 10px; align-items: center; }
.count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; }
.clock { font-family: var(--f-mono); font-size: .95rem; padding: 3px 10px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.clock.low { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.clock.over { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.dots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.dot { aspect-ratio: 1; max-width: 100%; border-radius: 6px; border: 1px solid var(--line); background: var(--paper); font-size: .72rem; font-variant-numeric: tabular-nums; padding: 0; display: grid; place-items: center; color: var(--muted); }
.dot.done { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); font-weight: 600; }
.dot.here { outline: 2px solid var(--ink); outline-offset: 1px; }

/* Question card */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: clamp(18px, 4vw, 28px); display: grid; gap: 18px; min-width: 0; }
.qnum { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); }
.qtext { font-family: var(--f-display); font-size: clamp(1.25rem, 3.6vw, 1.5rem); font-weight: 500; line-height: 1.35; text-wrap: pretty; }
.choices { display: grid; gap: 10px; }
.choice { display: grid; grid-template-columns: 34px 1fr; gap: 12px; align-items: center; text-align: left; width: 100%; padding: 12px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--paper); line-height: 1.4; transition: border-color .12s, background .12s; }
.choice:hover { border-color: var(--accent); }
.choice .key { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; border: 1.5px solid var(--line); font-size: .9rem; }
.choice[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.choice[aria-checked="true"] .key { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.btn { border-radius: 10px; padding: 11px 18px; font-weight: 600; border: 1.5px solid var(--line); background: var(--paper); }
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.hint { font-size: .82rem; color: var(--muted); }
.jump { display: grid; gap: 10px; }
.btn, .chip, .dot, .test-btn, .choice { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
@media (hover: none) { .keys-hint { display: none; } }
.notice { border-radius: 10px; padding: 12px 14px; display: grid; gap: 10px; font-size: .95rem; }
.notice.warn { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); }
.notice .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Results */
.result { display: grid; grid-template-columns: auto 1fr; gap: 20px 28px; align-items: center; }
.score { font-family: var(--f-display); font-size: clamp(3.4rem, 12vw, 4.6rem); font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: .4em; color: var(--muted); }
.verdict { display: grid; gap: 8px; justify-items: start; }
.pill { font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: .8rem; padding: 5px 12px; border-radius: 999px; }
.pill.pass { background: var(--good-soft); color: var(--good); border: 1px solid var(--good); }
.pill.fail { background: var(--bad-soft); color: var(--bad); border: 1px solid var(--bad); }
.bar { height: 10px; border-radius: 99px; background: var(--line); position: relative; overflow: hidden; width: 100%; max-width: 320px; }
.bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 99px; }
.bar b { position: absolute; top: -3px; bottom: -3px; left: 75%; width: 2px; background: var(--ink); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { border-radius: 999px; padding: 6px 14px; border: 1px solid var(--line); background: var(--paper); font-size: .88rem; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.review { display: grid; gap: 12px; }
.rv { background: var(--paper); border: 1px solid var(--line); border-left: 5px solid var(--good); border-radius: 12px; padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.rv.wrong { border-left-color: var(--bad); }
.rv-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.rv-q { font-weight: 600; }
.tag { font-size: .75rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.tag.ok { color: var(--good); }
.tag.no { color: var(--bad); }
.rv ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rv li { display: grid; grid-template-columns: 26px 1fr auto; gap: 8px; align-items: start; padding: 6px 10px; border-radius: 8px; font-size: .94rem; }
.rv li .k { font-weight: 700; color: var(--muted); }
.rv li .m { font-size: .78rem; font-weight: 700; white-space: nowrap; }
.rv li.correct { background: var(--good-soft); }
.rv li.correct .k, .rv li.correct .m { color: var(--good); }
.rv li.picked-wrong { background: var(--bad-soft); }
.rv li.picked-wrong .t { text-decoration: line-through; text-decoration-color: var(--bad); }
.rv li.picked-wrong .k, .rv li.picked-wrong .m { color: var(--bad); }
.why { font-size: .9rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.why b { color: var(--ink); }
.src { font-size: .78rem; color: var(--muted); font-family: var(--f-mono); }
.empty { color: var(--muted); text-align: center; padding: 20px; }
footer { font-size: .8rem; color: var(--muted); }
@media (max-width: 600px) {
  body { font-size: 18px; line-height: 1.6; }
  .wrap { padding-block: 20px 40px; gap: 20px; }
  h1 { font-size: 2.1rem; }
  h2 { font-size: 1.5rem; }
  .eyebrow { font-size: .8rem; }
  .lede { font-size: 1.05rem; }
  .fact { font-size: .95rem; padding: 6px 14px; }
  .picker { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .test-btn { padding: 16px; min-height: 96px; }
  .test-btn .n { font-size: 1.5rem; }
  .test-btn .last { font-size: .9rem; }
  .opts-row { font-size: 1rem; }
  .opts-row input { width: 24px; height: 24px; }
  .opts-row label { min-height: 48px; }
  .strip { padding-block: 12px; }
  .strip-top { flex-wrap: nowrap; }
  .strip-title { font-size: 1.05rem; }
  .count { font-size: 1rem; }
  .clock { font-size: 1.1rem; padding: 6px 12px; }
  .card { padding: 20px 18px; gap: 20px; }
  .qnum { font-size: .95rem; }
  .qtext { font-size: 1.4rem; line-height: 1.38; }
  .choice { grid-template-columns: 44px 1fr; gap: 14px; min-height: 64px; padding: 14px 16px; font-size: 1.1rem; }
  .choice .key { width: 44px; height: 44px; font-size: 1.05rem; }
  .btn { min-height: 54px; font-size: 1.05rem; padding: 12px 18px; }
  .nav .btn { flex: 1; }
  .exam-nav { position: sticky; bottom: 0; z-index: 4; background: var(--bg); padding-top: 12px; padding-bottom: max(12px, env(safe-area-inset-bottom, 0px)); margin-inline: -4px; padding-inline: 4px; border-top: 1px solid var(--line); flex-wrap: nowrap; }
  .dots { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
  .dot { aspect-ratio: auto; min-height: 48px; font-size: 1rem; border-radius: 8px; }
  .notice { font-size: 1.05rem; }
  .result { grid-template-columns: 1fr; }
  .score { font-size: 4.5rem; }
  .pill { font-size: .95rem; padding: 6px 14px; }
  .bar { max-width: none; height: 12px; }
  .verdict .hint { font-size: 1rem; }
  .chip { min-height: 46px; padding: 8px 16px; font-size: 1rem; }
  .filters h2 { flex-basis: 100%; }
  .rv { padding: 18px 16px; gap: 12px; }
  .tag { font-size: .85rem; }
  .src { font-size: .85rem; }
  .rv-q { font-size: 1.12rem; line-height: 1.45; }
  .rv li { grid-template-columns: 28px 1fr; font-size: 1.05rem; padding: 10px 12px; }
  .rv li .m { grid-column: 2; font-size: .9rem; }
  .rv li .m:empty { display: none; }
  .why { font-size: 1.02rem; }
  footer { font-size: .9rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.theme-toggle { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 30; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--paper); color: var(--muted); border-radius: 999px; padding: 8px 13px; font: 600 .8rem var(--f-body); cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.theme-toggle:hover { color: var(--ink); border-color: var(--accent); }
</style>

<div class="wrap" id="app"></div>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch between light and dark mode"></button>
<script>
(function () {
  var root = document.documentElement, KEY = "liuk-theme";
  function eff() { var t = root.getAttribute("data-theme"); if (t) return t; return (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light"; }
  function label() { var b = document.getElementById("themeToggle"); if (!b) return; var dark = eff() === "dark"; b.textContent = dark ? "☀ Light mode" : "🌙 Dark mode"; }
  try { var s = localStorage.getItem(KEY); if (s === "dark" || s === "light") root.setAttribute("data-theme", s); } catch (e) {}
  label();
  document.getElementById("themeToggle").addEventListener("click", function () {
    var next = eff() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
    label();
  });
})();
</script>

tizen.","V"],[14,"What skill were Iron Age people in Britain able to do that earlier peoples could not?",["Make and use iron tools","Build with concrete","Write in Latin","Sail across oceans"],0,"The Iron Age is named for the people's ability to make tools and weapons out of iron.","H"],[14,"The Magna Carta of 1215 is important because it established what principle?",["That the king was above the law","That even the king was subject to the law","That only nobles could vote","That England was a republic"],1,"Magna Carta established the idea that even the king was subject to the law and had to respect certain rights.","H"],[14,"The Habeas Corpus Act, guaranteeing nobody could be held unlawfully, was passed during whose reign?",["Charles I","Charles II","James I","Henry VIII"],1,"The Habeas Corpus Act of 1679, under Charles II, meant a prisoner had the right to be brought before a court.","H"],[14,"The first part of the United Kingdom to industrialise brought great wealth but also what problem?",["Religious war","Poor and crowded living and working conditions","Foreign invasion","The end of the monarchy"],1,"Industrial towns grew rapidly, often with poor housing and dangerous working conditions.","H"],[14,"The Romans named the island of Britain what?",["Albion","Britannia","Caledonia","Hibernia"],1,"The Romans called the province Britannia.","H"],[14,"Bonnie Prince Charlie led a Jacobite rising in which year, ending at Culloden?",["1715","1745","1707","1688"],1,"Charles Edward Stuart led the 1745 rising, which was crushed at Culloden in 1746.","H"],[14,"The peace agreement that helped end much of the conflict in Northern Ireland is known as what?",["The Treaty of Union","The Good Friday (Belfast) Agreement","The Treaty of Versailles","The Act of Settlement"],1,"The Good Friday Agreement of 1998 was a key step in the Northern Ireland peace process.","H"],[14,"The Act of Union 1707 created a single Parliament for Great Britain, based where?",["Edinburgh","Westminster (Lo e opposition in Parliament?",["To run government departments","To challenge and scrutinise the government","To appoint the Prime Minister","To collect taxes"],1,"The opposition's job is to hold the government to account and challenge its policies.","G"],[14,"The police force in the UK is expected to be what?",["Controlled by the governing party","Independent and professional, serving the public","Run by the army","Answerable only to the monarch"],1,"The police are expected to be professional, independent and to protect the public fairly.","G"],[14,"What happens at a citizenship ceremony?",["You sit an exam","You take an oath or affirmation and a pledge of loyalty","You are given a passport only","You join the army"],1,"New citizens attend a ceremony and make an oath or affirmation of allegiance and a pledge to the UK.","G"],[14,"What should you do if you move house, regarding your right to vote?",["Nothing","Register to vote again at your new address","Wait for an election","Inform the monarch"],1,"You need to register at your new address to stay on the electoral register.","G"],[14,"How often are elections for local councils usually held?",["Never","Regularly, on fixed cycles set by law","Only when the monarch decides","Once a century"],1,"Local council elections are held regularly according to fixed legal arrangements.","G"],[14,"What is the best way to deal with a disagreement with a neighbour, if talking does not work?",["Use violence","Seek help such as mediation or legal advice","Ignore the law","Damage their property"],1,"Disputes should be resolved peacefully and lawfully, for example through mediation or legal advice.","G"],[14,"Which of these is NOT part of Great Britain?",["England","Scotland","Wales","Northern Ireland"],3,"Great Britain refers only to England, Scotland and Wales. Northern Ireland is part of the UK but not of Great Britain.","U"],[14,"Which of these is a fundamental principle of British life?",["Rule of law","Censorship of the press","A s rtant discoveries in the early 19th century?",["Mary Anning","Mary Somerville","Rosalind Franklin","Ada Lovelace"],0,"Mary Anning found important fossils that helped develop the understanding of prehistoric life.","C"],[16,"The Eden Project, with giant greenhouse biomes, is located in which county?",["Kent","Cornwall","Devon","Norfolk"],1,"The Eden Project in Cornwall houses plants from around the world in huge domes.","C"],[16,"Bonfire Night on 5 November includes fireworks and remembers which event?",["The Great Fire of London","The failed Gunpowder Plot of 1605","The end of the Second World War","The Battle of Hastings"],1,"Bonfire Night marks the failure of the 1605 plot to blow up Parliament.","C"],[16,"Baroness Tanni Grey-Thompson is one of Britain's most successful athletes in which arena?",["Formula 1","The Paralympic Games","Wimbledon","The Boat Race"],1,"Dame Tanni Grey-Thompson won many gold medals as a Paralympic wheelchair racer.","C"],[16,"Which of these powers is devolved to the Scottish Parliament?",["Defence","Education and health in Scotland","Foreign policy","Immigration"],1,"Devolved matters such as education and health are decided by the Scottish Parliament, while defence and foreign affairs stay with the UK Parliament.","G"],[16,"Which of these must you have by law to drive a car in the UK?",["A valid driving licence, insurance and (for older cars) an MOT","Only a passport","Nothing at all","Just a provisional licence"],0,"To drive you need a valid licence, motor insurance and, for cars over a certain age, a valid MOT certificate.","G"],[16,"The House of Commons and the House of Lords together make up what?",["The Cabinet","Parliament","The judiciary","The civil service"],1,"Parliament is made up of the House of Commons and the House of Lords, along with the monarch.","G"],[16,"Taxes collected by the government pay for which of these?",["Private businesses","Public services such as roads, schools and the armed forces","The Commonwealth only","O ions.","G"],[18,"A government is usually formed by the party that does what at a general election?",["Comes second","Wins the most seats in the House of Commons","Wins the House of Lords","Has the most money"],1,"The party (or coalition) with a majority of seats in the Commons normally forms the government.","G"],[18,"How are most local councillors chosen?",["Appointed by the Prime Minister","Elected by local residents","Chosen by the monarch","Selected by MPs"],1,"Local councillors are elected by residents of the local area.","G"],[18,"What is a 'manifesto'?",["A court document","A statement of what a political party will do if elected","A tax form","A royal decree"],1,"A manifesto sets out the policies a political party promises to follow if it wins an election.","G"],[18,"Which of these is a minister in the Cabinet?",["The Chancellor of the Exchequer","The Speaker","A Supreme Court judge","The Archbishop of Canterbury"],0,"Cabinet ministers include the Chancellor of the Exchequer, the Home Secretary and the Foreign Secretary.","G"],[18,"Which of these is a Crown dependency?",["The Isle of Man","The Falkland Islands","Gibraltar","Bermuda"],0,"The Isle of Man is a Crown dependency. The Falklands, Gibraltar and Bermuda are British overseas territories.","U"],[18,"Looking for work when unemployed is best described as what?",["A legal offence","Part of taking responsibility for yourself and your family","Compulsory for all citizens","A role only for young people"],1,"Looking after yourself and your family, including looking for work when unemployed, is one of the responsibilities of living in the UK.","V"],[19,"Hadrian's Wall was built on the orders of which Roman emperor?",["Claudius","Hadrian","Nero","Augustus"],1,"The Emperor Hadrian ordered the wall built to keep out the Picts of what is now Scotland.","H"],[19,"Which king established the Church of England after the Pope refused to annul his marriage?",["Henry VII","Henry VIII","Edward VI","James I"],1,"Henry VIII ices such as rubbish collection, roads and libraries","The royal family","The national debt"],1,"Council tax is a local tax that helps pay for services provided by local authorities.","G"],[20,"Which of these is NOT a role of the monarch?",["Opening Parliament","Running the day-to-day government","Representing the UK on ceremonial occasions","Acting as head of the Commonwealth"],1,"The monarch has a ceremonial role; day-to-day government is run by the Prime Minister and ministers.","G"],[20,"Which of these is an example of volunteering?",["Paying income tax","Helping at a local school or hospital for free","Voting in an election","Serving on a jury"],1,"Volunteering means giving your time for free to help others or a good cause.","G"],[20,"Which of these is an example of 'the rule of law'?",["Important people being above the law","The same laws applying to everyone, including the government","Only the poor obeying laws","Laws changing in secret"],1,"The rule of law means laws apply equally to everyone, including those who govern.","G"],[20,"The way the UK is governed is based on which of these, even though there is no single written constitution?",["Laws, conventions and key historic documents","A secret rulebook","The monarch's personal wishes","Decisions of foreign courts"],0,"The UK constitution is made up of laws, conventions and important documents such as Magna Carta and the Bill of Rights.","G"],[20,"Around what fraction of the UK population lives in England?",["About one quarter","More than four-fifths","About half","About one tenth"],1,"England has by far the largest population, more than 80 per cent of the UK total.","U"],[20,"Treating others with fairness is an example of what?",["A legal loophole","A shared value and responsibility","A tax requirement","A voting rule"],1,"Treating others with fairness is one of the values and responsibilities expected of those living in the UK.","V"],[21,"The Anglo-Saxons came to Britain from which region?",["Scandinavia ting of books in English helped to do what?",["Reduce literacy","Spread ideas and standardise the language","End the monarchy","Stop the Reformation"],1,"Printing, introduced by Caxton, helped spread ideas and standardise written English.","H"],[27,"In which year did Ireland become formally joined with Great Britain to form the United Kingdom?",["1707","1801","1603","1922"],1,"The Act of Union of 1801 joined Ireland with Great Britain, creating the United Kingdom of Great Britain and Ireland.","H"],[27,"Isambard Kingdom Brunel was famous as a what?",["Poet","Engineer who built bridges, tunnels and railways","Painter","Composer"],1,"Brunel was one of the greatest engineers, building the Great Western Railway, bridges, tunnels and ships.","C"],[27,"Which playwright, born in Stratford-upon-Avon, wrote 'Hamlet' and 'Macbeth'?",["Charles Dickens","William Shakespeare","Geoffrey Chaucer","Christopher Marlowe"],1,"William Shakespeare was a playwright and poet, born in Stratford-upon-Avon.","C"],[27,"Which annual film awards are run by the British Academy of Film and Television Arts?",["The Oscars","The BAFTAs","The Baftas are American","The Grammys"],1,"The BAFTAs are the British film and television awards.","C"],[27,"Ben Nevis, the highest mountain in the UK, is located in which country?",["Wales","Scotland","England","Northern Ireland"],1,"Ben Nevis in the Scottish Highlands is the highest mountain in the United Kingdom.","C"],[27,"The home of cricket in England is often said to be which London ground?",["Wembley","Lord's","Twickenham","The Oval only"],1,"Lord's Cricket Ground in London is often called the 'home of cricket'.","C"],[27,"Robert Louis Stevenson, author of 'Treasure Island', came from which country?",["Wales","Scotland","Ireland","England"],1,"Robert Louis Stevenson was a Scottish writer famous for 'Treasure Island' and 'Dr Jekyll and Mr Hyde'.","C"],[27,"Caernarfon Castle and Conwy Castle are famous medieval castles in which country?",["Scotland","Wales","England","Northern Ireland"],1,"These great castles in Wales were built in the reign of Edward I.","C"],[27,"Which part of Parliament is made up of elected members?",["The House of Lords","The House of Commons","The Cabinet","The Privy Council"],1,"Members of the House of Commons (MPs) are elected by the public.","G"],[27,"The 'rule of law' means that what?",["The monarch is above the law","Everyone, including those in power, must obey the law","Only citizens must obey the law","Laws apply only to criminals"],1,"The rule of law means no one is above the law, including people in government.","G"],[27,"The Commonwealth is an association of countries most of which were once part of what?",["The Roman Empire","The British Empire","The European Union","NATO"],1,"The Commonwealth is a voluntary association, most of whose members were once part of the British Empire.","G"],[27,"What is the purpose of a general election?",["To choose the monarch","To elect MPs to the House of Commons","To appoint judges","To select civil servants"],1,"A general election is held to elect MPs to represent constituencies in the House of Commons.","G"],[27,"The National Health Service (NHS) provides healthcare that is mostly what?",["Only for the wealthy","Free at the point of use","Only for citizens","Paid for in full each visit"],1,"The NHS provides healthcare that is mostly free at the point of use, funded through taxation.","G"],[27,"What should you do with household waste to help the environment?",["Burn it all","Separate and recycle it where possible","Dump it in rivers","Leave it in the street"],1,"Recycling and reducing waste are important ways to look after the environment.","G"],[27,"What does it mean that the UK is a 'constitutional monarchy'?",["The monarch has absolute power","The monarch is head of state but governs within limits set by law and Parliament","There is no monarch","The monarch runs the courts"],1,"In a constitutional monarchy the monarch is head of state but real political power lies with Parliament and ministers.","G"],[27,"Which stretch of water separates England from France?",["The Irish Sea","The English Channel","The North Sea","The Bristol Channel"],1,"The English Channel separates the south of England from France.","U"],[27,"Which of these is a shared value that helps people live together peacefully?",["Extremism","Tolerance of different faiths and beliefs","Discrimination","Violence"],1,"Tolerance of different faiths and beliefs is a fundamental principle of life in the UK.","V"],[28,"The Battle of Hastings in 1066 is famously depicted in what?",["The Domesday Book","The Bayeux Tapestry","Magna Carta","The Lindisfarne Gospels"],1,"The Bayeux Tapestry, which can still be seen in France, shows the events of the Norman Conquest.","H"],[28,"Who commissioned the King James Bible, an English translation still used today?",["Henry VIII","James I","Charles II","William III"],1,"James I ordered a new English translation of the Bible, known as the King James Version or Authorised Version.","H"],[28,"The Quakers and others set up the first formal anti-slavery groups. Which man led the campaign in Parliament?",["William Wilberforce","William Pitt","Robert Peel","Charles Grey"],0,"William Wilberforce was a leading campaigner in Parliament against the slave trade.","H"],[28,"After 1945, the government led by Clement Attlee created what?",["The British Empire","The National Health Service and the welfare state","The Church of England","Magna Carta"],1,"The post-war Labour government set up the NHS in 1948 and expanded the welfare state.","H"],[28,"King James I and VI was king of both England and which other country?",["France","Scotland","Ireland only","Wales"],1,"James was already King James VI of Scotland before becoming James I of England in 1603.","H"],[28,"Which event in 1926 saw workers across many industries stop work in protest?",["The General Strike","The Blitz","The Great Depression","The Peasants' Revolt"],0,"The General Strike of 1926 involved workers in key industries stopping work.","H"],[28,"Who became the first Protestant ruler to firmly establish the Church of England after religious upheaval?",["Mary I","Elizabeth I","Henry VII","James II"],1,"Elizabeth I firmly re-established the Protestant Church of England after her sister Mary's Catholic reign.","H"],[28,"Which doctor developed vaccination, pioneering a vaccine against smallpox?",["Edward Jenner","Alexander Fleming","Joseph Lister","John Snow"],0,"Edward Jenner developed the technique of vaccination, using it against smallpox.","H"],[28,"The radar used to detect aircraft was developed by a team led by which Scottish scientist?",["Sir Robert Watson-Watt","Alexander Fleming","James Watt","John Logie Baird"],0,"Sir Robert Watson-Watt pioneered the radar technology vital in the Second World War.","C"],[28,"The famous line 'To be or not to be' comes from which Shakespeare play?",["Romeo and Juliet","Hamlet","Macbeth","Othello"],1,"'To be or not to be' is from Shakespeare's play 'Hamlet'.","C"],[28,"Christmas Day is celebrated on which date?",["24 December","25 December","26 December","1 January"],1,"Christmas Day, 25 December, celebrates the birth of Jesus Christ and is a public holiday.","C"],[28,"The Tower of London, famous for the Crown Jewels, is guarded by whom?",["Police officers","Yeoman Warders (Beefeaters)","Soldiers of the RAF","Park rangers"],1,"The Yeoman Warders, nicknamed Beefeaters, guard the Tower of London.","C"],[28,"Rugby union's home stadium in England is at which location?",["Wembley","Twickenham","Murrayfield","The Millennium Stadium"],1,"Twickenham in London is the home of English rugby union.","C"],[28,"The poet Rudyard Kipling wrote which famous poem beginning 'If'?",["'If'","'The Tyger'","'Daffodils'","'The Waste Land'"],0,"Rudyard Kipling's poem 'If' is one of the best-loved poems in Britain.","C"],[28,"The White Cliffs are a famous coastal landmark near which English town?",["Dover","Brighton","Blackpool","Whitby"],0,"The White Cliffs of Dover are a well-known landmark on the south coast of England.","C"],[28,"Members of the House of Lords are generally what?",["Elected by the public","Not elected, including life peers and bishops","Chosen by the monarch alone","Appointed by local councils"],1,"Members of the Lords are not elected; they include life peers, senior bishops and some hereditary peers.","G"],[28,"The legal system in which part of the UK is notably different from the rest?",["Wales","Scotland","England","The Isle of Wight"],1,"Scotland has its own distinct legal system, separate from that of England, Wales and Northern Ireland.","G"],[28,"Who is the ceremonial head of the Commonwealth?",["The Prime Minister","The monarch","The Secretary-General of the UN","The Speaker"],1,"The monarch is the head of the Commonwealth, which has no power over its members.","G"],[28,"Judges in the UK are expected to be what?",["Members of the governing party","Independent of government","Elected by the public","Appointed by the Speaker"],1,"The judiciary is independent of government, ensuring the law is applied fairly.","G"],[28,"To register with a doctor, you usually sign up with a local what?",["Hospital consultant","GP (general practitioner) surgery","Pharmacy only","Dentist only"],1,"People usually register with a local GP surgery for everyday health needs.","G"],[28,"Paying your taxes helps to fund which of these?",["Private company profits","Public services such as the NHS, schools and roads","The Royal Family's private business","Foreign companies"],1,"Taxes pay for public services including health, education, transport and defence.","G"],[28,"Which body is responsible for day-to-day running of the country?",["The monarch alone","The government, led by the Prime Minister","The Supreme Court","The House of Lords alone"],1,"The government, headed by the Prime Minister and the Cabinet, runs the country day to day.","G"],[28,"What is the island group that includes Great Britain and Ireland sometimes called?",["The British Isles","The Channel Islands","The Western Isles","The Shetland Isles"],0,"The term 'British Isles' refers to the group of islands including Great Britain and Ireland.","U"],[28,"Which of these is a public holiday in the UK, when many people do not work?",["A bank holiday","A general election day","A by-election","A jury day"],0,"Bank holidays are public holidays, such as those at Christmas, Easter and in spring and summer, when many businesses close.","V"],[29,"What language did the Norman ruling class speak after 1066?",["Old English","Norman French","Latin","Welsh"],1,"The Norman kings and nobles spoke Norman French, which influenced the development of the English language.","H"],[29,"The English Civil War was a conflict between the king and whom?",["The Church","Parliament","Scotland alone","Foreign invaders"],1,"The Civil War was fought between the supporters of King Charles I and the supporters of Parliament.","H"],[29,"After slavery was abolished, workers from which region were brought to colonies as indentured labourers?",["India and other parts of the empire","Scandinavia","Germany","France"],0,"Many people from India and elsewhere in the empire worked as indentured labourers after abolition.","H"],[29,"Who led the team that created the National Health Service as Minister of Health?",["Aneurin (Nye) Bevan","Winston Churchill","William Beveridge","Clement Attlee"],0,"Aneurin Bevan, as Minister of Health, led the establishment of the NHS in 1948.","H"],[29,"The ship the 'Mayflower' carried Puritans in 1620 to settle where?",["Australia","America","India","the Caribbean"],1,"The Pilgrim Fathers sailed on the Mayflower to settle in America.","H"],[29,"Who was the British Prime Minister who followed a policy of 'appeasement' before the Second World War?",["Winston Churchill","Neville Chamberlain","Clement Attlee","Stanley Baldwin"],1,"Neville Chamberlain pursued appeasement towards Nazi Germany before the war.","H"],[29,"The 'Golden Age' of exploration and the arts in England took place under which monarch?",["Henry VII","Elizabeth I","James II","George I"],1,"Elizabeth I's reign is often called a golden age, with writers like Shakespeare and explorers like Drake.","H"],[29,"The 'Spinning Jenny', which improved cloth-making, was invented by whom?",["James Hargreaves","Richard Arkwright","James Watt","George Stephenson"],0,"James Hargreaves invented the Spinning Jenny, an important machine in the textile industry.","H"],[29,"Which British physicist split the atom in 1917 and is called the father of nuclear physics?",["Ernest Rutherford","Isaac Newton","Stephen Hawking","Michael Faraday"],0,"Ernest Rutherford was the first person to split the atom.","C"],[29,"Which Scottish poet wrote in the Scots language and is celebrated on Burns Night?",["Robert Burns","William Wordsworth","Dylan Thomas","John Milton"],0,"Robert Burns, known as 'the Bard', wrote poems and songs in Scots; Burns Night is held on 25 January.","C"],[29,"What is traditionally eaten as a main Christmas meal in the UK?",["Haggis","Roast turkey","Fish and chips","Pancakes"],1,"Roast turkey with vegetables is a traditional Christmas meal, often followed by Christmas pudding.","C"],[29,"Which building in Edinburgh is a famous castle dominating the city skyline?",["Edinburgh Castle","Windsor Castle","Caernarfon Castle","The Tower of London"],0,"Edinburgh Castle is a well-known landmark in the Scottish capital.","C"],[29,"Darts, snooker and football are examples of what?",["Festivals","Popular sports in the UK","Religious events","Government ceremonies"],1,"These are among the sports widely followed and played in the UK.","C"],[29,"Which comic actor and filmmaker from London became a global star of silent films?",["Charlie Chaplin","Laurence Olivier","Alfred Hitchcock","David Niven"],0,"Charlie Chaplin, born in London, became famous worldwide for his silent films.","C"],[29,"The Giant's Causeway and the Titanic Quarter are attractions in which city/region?",["Cardiff","Belfast/Northern Ireland","Glasgow","Liverpool"],1,"The Giant's Causeway is in Northern Ireland, and the Titanic (built in Belfast) is remembered in the Titanic Quarter.","C"],[29,"The area represented by one MP is called what?",["A county","A constituency","A ward","A borough"],1,"A constituency is the area that each MP is elected to represent.","G"],[29,"Criminal law deals with what?",["Disputes between individuals","Behaviour the state has made illegal, such as theft and violence","Business contracts only","Property boundaries"],1,"Criminal law covers crimes that the state punishes, such as theft, assault and drug offences.","G"],[29,"What should you do if you want to stand for public office, such as becoming a councillor?",["Nothing is allowed","You can stand for election if you are eligible","You must be appointed by the monarch","Only the wealthy may stand"],1,"Citizens who meet the requirements can stand for election to local councils and other public offices.","G"],[29,"If you are arrested, which of these rights do you have?",["No rights at all","To be treated fairly and, in serious cases, to have legal representation","To be tried without a court","To be punished immediately"],1,"People who are arrested have legal rights, including fair treatment and, where appropriate, access to legal advice.","G"],[29,"If you need urgent medical help but it is not life-threatening, you can call which number?",["999","111","101","112"],1,"NHS 111 provides advice for urgent but non-emergency health problems; 999 is for emergencies.","G"],[29,"The money you pay for a television licence helps fund what?",["Commercial adverts","The BBC","The National Lottery","Local councils"],1,"The TV licence fee funds the BBC's services.","G"],[29,"A citizen who disagrees with a new law can lawfully do which of these?",["Campaign and lobby their MP to change it","Refuse to obey all laws","Damage public property","Threaten officials"],0,"People can campaign peacefully, write to their MP and join groups to try to change laws they disagree with.","G"],[29,"Which of these is the largest country within the UK by area and population?",["Scotland","England","Wales","Northern Ireland"],1,"England is the largest of the four countries of the UK by both area and population.","U"],[29,"Learning about the UK's history and traditions helps a new resident to do what?",["Avoid paying tax","Take a fuller part in the life of their community","Become an MP automatically","Gain a free house"],1,"Understanding the UK's history and traditions helps people integrate and take part in community life.","V"],[30,"The Domesday Book was compiled on the orders of which king?",["Alfred the Great","William the Conqueror","Henry II","Richard I"],1,"William the Conqueror ordered the Domesday Book, a survey of England's land and people, completed in 1086.","H"],[30,"Supporters of Parliament in the Civil War were nicknamed what?",["Cavaliers","Roundheads","Jacobites","Whigs"],1,"Parliament's supporters were called Roundheads, while the king's supporters were called Cavaliers.","H"],[30,"Queen Victoria reigned from 1837 for how long, the longest of any monarch up to that time?",["About 25 years","About 64 years","About 40 years","About 10 years"],1,"Victoria reigned for almost 64 years, longer than any previous monarch, a period called the Victorian Age.","H"],[30,"The 1950s saw people invited from which region to help rebuild Britain after the war?",["The West Indies, India and Pakistan","Scandinavia","South America","Japan"],0,"Workers from the West Indies, India, Pakistan and elsewhere were invited to help fill labour shortages.","H"],[30,"Which disease spread rapidly in the crowded city of London in 1665?",["Cholera","The plague","Smallpox","Measles"],1,"The Great Plague of 1665 killed a large number of people in London.","H"],[30,"The 'Battle of Britain' in 1940 was fought mainly where?",["At sea","In the air","In North Africa","In the Russian winter"],1,"The Battle of Britain was an air battle in which the RAF defeated the German Luftwaffe.","H"],[30,"The settlement of Protestants in Ulster during the reign of James I is known as what?",["The Plantation of Ulster","The Highland Clearances","The Enclosures","The Restoration"],0,"The Plantation of Ulster saw Protestant settlers from England and Scotland given land in the north of Ireland.","H"],[30,"Canals were built across Britain during the Industrial Revolution mainly to do what?",["Provide drinking water","Transport goods and raw materials","Grow crops","Defend against invasion"],1,"A network of canals was built to move goods and raw materials for the growing industries.","H"],[30,"The first cash dispenser (ATM) and other inventions reflect the UK's strength in what field?",["Science, technology and engineering","Agriculture","Textiles only","Film"],0,"The UK has a long history of scientific and technological innovation.","C"],[30,"The Romantic poets included Wordsworth, Byron, Shelley and which other?",["Geoffrey Chaucer","William Blake","Charles Dickens","Rudyard Kipling"],1,"William Blake was among the Romantic poets, along with Wordsworth, Byron, Shelley and Keats.","C"],[30,"New Year is celebrated on 1 January, but the Scottish celebration is especially known and called what?",["Hogmanay","Eisteddfod","Hallowe'en","Diwali"],0,"Hogmanay is the Scottish celebration of New Year, sometimes a bigger event than Christmas there.","C"],[30,"The National Trust was founded to do what?",["Run the railways","Preserve important buildings, coastline and countryside","Collect taxes","Organise sport"],1,"The National Trust works to preserve places of historic interest and natural beauty.","C"],[30,"The National Lottery, launched in 1994, gives much of its money to what?",["Private companies","Good causes such as sport, arts and heritage","The Royal Family","Foreign governments"],1,"The National Lottery raises money for good causes including the arts, sport, heritage and charities.","C"],[30,"The film director Alfred Hitchcock was famous for making which kind of films?",["Westerns","Thrillers and suspense films","Musicals","Nature documentaries"],1,"Alfred Hitchcock, a British director, was known as the 'master of suspense'.","C"],[30,"The famous luxury ocean liner Titanic was built in which city?",["Liverpool","Belfast","Southampton","Glasgow"],1,"The Titanic was built in Belfast, Northern Ireland.","C"],[30,"How is the Prime Minister normally determined?",["Elected directly by all voters","The leader of the party that wins the most seats in the Commons","Appointed by the House of Lords","Chosen by the civil service"],1,"The Prime Minister is usually the leader of the party that wins a majority of seats in the House of Commons.","G"],[30,"Civil law deals with what kind of matters?",["Serious crimes","Disputes between people or organisations, such as debt or housing","Treason","Murder"],1,"Civil law covers disputes between individuals or groups, for example over money, housing or employment.","G"],[30,"Freedom of speech in the UK means people can do what?",["Say anything with no limits at all","Express opinions, within the limits of the law","Only praise the government","Speak only in Parliament"],1,"People are free to express their views, as long as they stay within the law and do not incite hatred or violence.","G"],[30,"Solicitors and barristers are types of what?",["Police officers","Lawyers","Judges only","Civil servants"],1,"Solicitors and barristers are legal professionals who advise and represent people in legal matters.","G"],[30,"To report a crime that is not an emergency, which number can you call?",["999","101","111","112"],1,"You can call 101 to contact the police about a non-emergency.","G"],[30,"Which of these is a role a citizen can take on in the justice system?",["Serving as a juror","Passing laws alone","Appointing judges","Running a prison"],0,"Serving on a jury is one way citizens take part in the justice system.","G"],[30,"Who makes sure that government departments spend public money properly?",["No one","Parliament, through scrutiny and committees","Only the monarch","Only the courts"],1,"Parliament holds the government to account, including over how it spends public money.","G"],[30,"The Severn and the Thames are examples of what in the UK?",["Mountains","Rivers","Cities","Lakes"],1,"The River Severn and the River Thames are among the UK's major rivers.","U"],[30,"The UK is a diverse society made up of people of many what?",["Only one background","Different ethnic origins, cultures and religions","Identical opinions","The same age"],1,"The UK is a diverse society with people of many different backgrounds, cultures and faiths.","V"]];
</script>
<script>
(function () {
  const PASS = 18, N = 24, LIMIT = 45 * 60, NTESTS = 30;
  const L = "ABCD";
  const TOPICS = [
    ["V", "Values & principles"],
    ["U", "What is the UK?"],
    ["H", "History"],
    ["C", "Society & culture"],
    ["G", "Government & law"]
  ];
  const TLABEL = Object.fromEntries(TOPICS);
  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  // Each bank row: [test, question, [A,B,C,D], correctIndex, explanation, topic]
  const byTest = t => BANK.map((r, i) => i).filter(i => BANK[i][0] === t);
  const byTopic = c => BANK.map((r, i) => i).filter(i => BANK[i][5] === c);
  const topicCount = c => byTopic(c).length;

  let S = { view: "start", timer: store.get("liuk-timer", true) };
  let tick = null;

  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

  function begin(test) {
    let ids;
    if (test === "R") ids = shuffle(BANK.map((_, i) => i)).slice(0, N);
    else if (typeof test === "string" && test[0] === "T") ids = shuffle(byTopic(test.slice(2))).slice(0, N);
    else ids = byTest(test);
    S = { view: "exam", timer: S.timer, test, ids, ans: Array(ids.length).fill(null), cur: 0, started: Date.now(), confirm: false, filter: "all" };
    run(); render(); window.scrollTo(0, 0);
  }
  function run() {
    clearInterval(tick);
    if (S.view === "exam" && S.timer) tick = setInterval(updateClock, 1000);
  }
  function elapsed() { return Math.floor(((S.ended || Date.now()) - S.started) / 1000); }
  function fmt(sec) { const s = Math.abs(sec); return (sec < 0 ? "+" : "") + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
  function updateClock() {
    const el = document.getElementById("clock"); if (!el) return;
    const left = LIMIT - elapsed();
    el.textContent = left >= 0 ? fmt(left) : "Over " + fmt(-left).replace("+", "");
    el.className = "clock" + (left < 0 ? " over" : left < 300 ? " low" : "");
    el.title = left < 0 ? "The real exam would have ended. You can still finish." : "Time left of 45 minutes";
  }
  const title = t => t === "R" ? "Random 24" : (typeof t === "string" && t[0] === "T") ? TLABEL[t.slice(2)] + " · 24" : "Practice Test " + t;

  
  function pick(i) {
    if (S.ans[S.cur] !== null) return;
    S.ans[S.cur] = i;
    S.confirm = false;
    render();
  }


  function go(i) {
    if (i < 0 || i >= S.ids.length) return;
    S.cur = i;
    S.confirm = false;
    render();
  }

  function submit(force) {
    const missing = S.ans.filter(a => a === null).length;
    if (missing && !force) {
      S.confirm = true;
      render();
      return;
    }
    S.ended = Date.now();
    S.view = "result";
    clearInterval(tick);
    S.score = S.ids.reduce((n, id, k) => n + (S.ans[k] === BANK[id][3]), 0);
    const hist = store.get("liuk-last", {});
    hist[S.test] = S.score;
    store.set("liuk-last", hist);
    render();
    window.scrollTo(0, 0);
  }

  function viewStart() {
    const hist = store.get("liuk-last", {});
    const last = k => hist[k] == null ? "Not taken yet" : "Last score " + hist[k] + "/24";
    const cls = k => hist[k] == null ? "" : hist[k] >= PASS ? " pass" : " fail";
    let tests = "";
    for (let t = 1; t <= NTESTS; t++) tests += `<button class="test-btn" data-test="${t}"><span class="eyebrow">Test</span><span class="n">${t}</span><span class="last${cls(t)}">${last(t)}</span></button>`;
    const topics = TOPICS.map(([c, lab]) => `<button class="test-btn topic" data-test="T:${c}"><span class="n">${lab}</span><span class="last">Random 24 · ${topicCount(c)} in the bank</span></button>`).join("");
    return `
      <header style="display:grid;gap:12px">
        <span class="eyebrow">Life in the UK · citizenship test practice</span>
        <h1>Mock exam</h1>
        <p class="lede">Pick a test and answer all 24 questions. Choose an answer to see immediately whether it is correct, along with an explanation. Your first answer is locked in, and you can review your score after submitting.</p>
        <div class="facts"><span class="fact"><b>24</b> questions</span><span class="fact"><b>45</b> minutes</span><span class="fact">Pass mark <b>18/24</b> (75%)</span><span class="fact"><b>720</b> questions · <b>30</b> tests</span></div>
      </header>
      <section style="display:grid;gap:14px" aria-label="Choose a test">
        <h2>Choose a test</h2>
        <div class="picker">${tests}
          <button class="test-btn random" data-test="R"><span class="n">Random 24 from all 720</span><span class="last">A fresh mix every time${hist.R == null ? "" : " · last score " + hist.R + "/24"}</span></button>
        </div>
        <div class="opts-row"><label for="opt-timer"><input type="checkbox" id="opt-timer" ${S.timer ? "checked" : ""}> Show a 45-minute countdown</label></div>
      </section>
      <section style="display:grid;gap:14px" aria-label="Practise by topic">
        <h2>Practise by topic</h2>
        <p class="lede">Weak on one chapter? Get a random 24 drawn only from that part of the handbook. History and the government and society chapters are tested most heavily.</p>
        <div class="picker">${topics}</div>
      </section>
      <footer>Questions are written from the official handbook, <i>Life in the United Kingdom: A Guide for New Residents</i> (3rd edition). Facts that have changed since it was published are left out.</footer>`;
  }

  function viewExam() {
    const n = S.ids.length;
    const id = S.ids[S.cur], r = BANK[id], a = S.ans[S.cur];
    const done = S.ans.filter(x => x !== null).length;
    const dots = S.ids.map((_, k) => `<button class="dot${S.ans[k] !== null ? " done" : ""}${k === S.cur ? " here" : ""}" data-go="${k}" aria-label="Question ${k + 1}${S.ans[k] !== null ? ", answered" : ""}">${k + 1}</button>`).join("");
    
    const choices = r[2].map((o, i) => {
      const answered = a !== null;
      const correct = i === r[3];
    
      const background = answered && correct
        ? "#dcfce7"
        : answered && i === a
          ? "#fee2e2"
          : "";
    
      return `<button class="choice"
        role="radio"
        aria-checked="${a === i}"
        data-pick="${i}"
        ${answered ? "disabled" : ""}
        style="${background ? `background:${background};color:#111827;opacity:1;` : ""}">
        <span class="key">${L[i]}</span>
        <span>${esc(o)}</span>
      </button>`;
    }).join("");
    
    const feedback = a === null ? "" : `
      <div class="notice" role="status">
        <strong>${a === r[3] ? "✓ Correct!" : "✗ Incorrect"}</strong>
        <p>Correct answer: ${esc(r[2][r[3]])}</p>
        <p>${esc(r[4])}</p>
      </div>`;

    const missing = n - done;
    const confirm = S.confirm ? `<div class="notice warn" role="alert"><p>You have <b>${missing}</b> unanswered question${missing === 1 ? "" : "s"}. They will be marked wrong.</p><div class="row"><button class="btn" data-act="first-gap">Go to first unanswered</button><button class="btn primary" data-act="force">Submit anyway</button></div></div>` : "";
    return `
      <div class="strip">
        <div class="strip-top">
          <span class="strip-title">${title(S.test)}</span>
          <span class="strip-meta"><span class="count">${done}/${n} done</span>${S.timer ? `<span class="clock" id="clock">45:00</span>` : ""}</span>
        </div>
      </div>
      <article class="card" aria-live="polite">
        <span class="qnum">Question ${S.cur + 1} of ${n}</span>
        <p class="qtext">${esc(r[1])}</p>
        <div class="choices" role="radiogroup" aria-label="Answers">${choices}</div>
        ${feedback}
      </article>
      ${confirm}
      <div class="nav exam-nav">
        <button class="btn ghost" data-act="prev" ${S.cur === 0 ? "disabled" : ""}>&larr; Back</button>
        ${S.cur < n - 1 ? `<button class="btn primary" data-act="next">Next &rarr;</button>` : `<button class="btn primary" data-act="submit">Submit answers</button>`}
      </div>
      <section class="jump" aria-label="Jump to question"><span class="eyebrow">Jump to a question · shaded = answered</span><div class="dots">${dots}</div></section>
      <div class="nav" style="align-items:center">
        <span class="hint keys-hint">Keys: A&ndash;D or 1&ndash;4 to answer, &larr; &rarr; to move.</span>
        <span style="display:flex;gap:8px;flex-wrap:wrap">${S.cur < n - 1 ? `<button class="btn" data-act="submit">Submit now</button>` : ""}<button class="btn ghost" data-act="quit">Quit</button></span>
      </div>`;
  }

  function viewResult() {
    const n = S.ids.length;
    const pass = S.score >= PASS, wrong = n - S.score, secs = elapsed();
    const items = S.ids.map((id, k) => ({ id, k, r: BANK[id], a: S.ans[k] })).filter(x => S.filter === "all" || x.a !== x.r[3]);
    const review = items.map(({ id, k, r, a }) => {
      const ok = a === r[3];
      const lis = r[2].map((o, i) => {
        const c = i === r[3], pw = i === a && !ok;
        const mark = c ? (i === a ? "✓ Your answer" : "✓ Correct answer") : pw ? "✗ Your answer" : "";
        return `<li class="${c ? "correct" : pw ? "picked-wrong" : ""}"><span class="k">${L[i]}</span><span class="t">${esc(o)}</span><span class="m">${mark}</span></li>`;
      }).join("");
      const src = `<span class="src">${TLABEL[r[5]]} · Test ${r[0]}, Q${byTest(r[0]).indexOf(id) + 1}</span>`;
      return `<article class="rv${ok ? "" : " wrong"}"><div class="rv-head"><span class="tag ${ok ? "ok" : "no"}">Q${k + 1} · ${ok ? "Correct" : a === null ? "Not answered" : "Wrong"}</span>${src}</div><p class="rv-q">${esc(r[1])}</p><ul class="rv-opts">${lis}</ul><p class="rv-exp">${esc(r[4])}</p></article>`;
    }).join("") || `<p class="empty">No wrong answers. Every question was correct.</p>`;
    return `
      <header style="display:grid;gap:8px"><span class="eyebrow">${title(S.test)} · results</span><h1>${pass ? "You passed" : "Not a pass this time"}</h1></header>
      <section class="card result" aria-label="Score">
        <div class="score">${S.score}<small>/${n}</small></div>
        <div class="verdict">
          <span class="pill ${pass ? "pass" : "fail"}">${pass ? "Pass" : "Fail"}</span>
          <div class="bar" aria-hidden="true"><i style="width:${(S.score / n * 100).toFixed(1)}%"></i><b title="Pass mark 18"></b></div>
          <p class="hint">${Math.round(S.score / n * 100)}% · ${wrong} wrong · pass mark is 18 (75%) · ${pass ? "" : "you needed " + (PASS - S.score) + " more · "}time ${fmt(secs)}${secs > LIMIT ? " (over 45 min)" : ""}</p>
        </div>
      </section>
      <div class="nav"><button class="btn primary" data-act="retry">Retry ${typeof S.test === "number" ? "this test" : "with a new 24"}</button><button class="btn" data-act="home">Choose another test</button></div>
      <section style="display:grid;gap:14px" aria-label="Review">
        <div class="filters"><h2 style="margin-right:auto">Review</h2>
          <button class="chip" data-filter="all" aria-pressed="${S.filter === "all"}">All ${n}</button>
          <button class="chip" data-filter="wrong" aria-pressed="${S.filter === "wrong"}">Wrong only (${wrong})</button>
        </div>
        <div class="review">${review}</div>
      </section>`;
  }

  function render() {
    app.innerHTML = S.view === "start" ? viewStart() : S.view === "exam" ? viewExam() : viewResult();
    if (S.view === "exam" && S.timer) updateClock();
  }

  app.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset;
    if (d.test) return begin((d.test === "R" || d.test[0] === "T") ? d.test : +d.test);
    if (d.pick) return pick(+d.pick);
    if (d.go) return go(+d.go);
    if (d.filter) { S.filter = d.filter; return render(); }
    switch (d.act) {
      case "prev": return go(S.cur - 1);
      case "next": return go(S.cur + 1);
      case "submit": return submit(false);
      case "force": return submit(true);
      case "first-gap": return go(S.ans.indexOf(null));
      case "retry": return begin(S.test);
      case "home": case "quit": clearInterval(tick); S = { view: "start", timer: S.timer }; render(); return window.scrollTo(0, 0);
    }
  });
  app.addEventListener("change", e => {
    if (e.target.id === "opt-timer") { S.timer = e.target.checked; store.set("liuk-timer", S.timer); }
  });
  document.addEventListener("keydown", e => {
    if (S.view !== "exam" || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toUpperCase();
    let i = L.indexOf(k); if (i < 0 && "1234".includes(k) && k) i = +k - 1;
    if (i >= 0 && k.length === 1) { e.preventDefault(); return pick(i); }
    if (e.key === "ArrowRight") return go(S.cur + 1);
    if (e.key === "ArrowLeft") return go(S.cur - 1);
  });

  function start(saved) {
    if (saved && saved.view) S = saved;
    run(); render();
  }
  window.claude?.hot?.snapshot?.(() => S);
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
